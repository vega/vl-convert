[package]
name = "vl-convert-canvas2d"
version.workspace = true
edition.workspace = true
description = "Pure Rust Canvas 2D API implementation using tiny-skia and cosmic-text"
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["canvas", "2d", "graphics", "tiny-skia"]

[dependencies]
# Graphics rendering
tiny-skia = { workspace = true }

# Text shaping and measurement
cosmic-text = "0.19.0"

# Font database (shared with vl-convert-rs via usvg)
fontdb = { workspace = true }

# PNG encoding
png = { workspace = true }

# CSS color parsing
csscolorparser = "0.8.4"

# SVG path parsing (for Path2D from SVG string)
svgtypes = "0.16"

# Arc-to-cubic-bezier conversion
kurbo = "0.13"

# Error handling
thiserror = "2"

# Logging
log = { workspace = true }

[dev-dependencies]
# For testing
rstest = { workspace = true }

# For image comparison tests
image = "0.25"
pixelmatch = "0.1.0"
tempfile = "3"
