[package]
name = "vl-convert-server"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
homepage = "https://github.com/jonmmease/vl-convert"
repository.workspace = true
description = "HTTP server for converting Vega-Lite and Vega specifications to static images"
keywords = ["Visualization", "Vega", "Vega-Lite", "Server"]

[package.metadata.docs.rs]
# Propagate the cfg to dependency build scripts, including vl-convert-rs.
rustc-args = ["--cfg", "vl_convert_docsrs"]

[dependencies]
vl-convert-rs = { workspace = true }
vl-convert-google-fonts = { workspace = true }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
log = { workspace = true }
shellexpand = { workspace = true }
itertools = { workspace = true }
axum = { version = "0.8.9", features = ["json"] }
tower = { version = "0.5", features = ["timeout", "limit", "load-shed"] }
tower-http = { version = "0.7.1", features = ["catch-panic", "compression-full", "cors", "request-id", "timeout", "trace", "propagate-header", "util"] }
subtle = "2"
http = "1"
tracing = "0.1"
tracing-log = "0.2"
# `init_tracing` relies on `tracing-log` for the `log` -> `tracing` bridge.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "env-filter", "tracing-log"] }
dashmap = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2.0"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum", "vendored"] }
arc-swap = "1.9"

[target.'cfg(unix)'.dependencies]
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }

[dev-dependencies]
reqwest = { workspace = true, features = ["blocking", "json"] }
tokio = { workspace = true }
serde_json = { workspace = true }
once_cell = "1"
tempfile = { workspace = true }
# UDS integration tests use a raw hyper client over tokio UnixStream.
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "tokio"] }
http-body-util = "0.1"
bytes = "1"
