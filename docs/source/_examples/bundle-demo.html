<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>VlConvert bundle example</title>
  </head>
  <body>
    <div id="vis"></div>
    <script src="app-chart.js"></script>
    <script>
      const spec = {
        "$schema": "https://vega.github.io/schema/vega-lite/v6.json",
        "data": {"values": [{"category": "A", "value": 28}, {"category": "B", "value": 55}]},
        "mark": "bar",
        "encoding": {
          "x": {"field": "category", "type": "nominal"},
          "y": {"field": "value", "type": "quantitative"}
        }
      };
      window.renderVegaLite("#vis", spec);
    </script>
  </body>
</html>
