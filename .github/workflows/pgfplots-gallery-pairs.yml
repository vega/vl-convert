name: Altair versus native PGFPlots gallery pairs
on:
  push:
    branches: [feature/experimental-pgfplots-export]
    paths:
      - 'vl-convert-rs/tests/native-pgfplots/gallery_pairs.py'
      - '.github/workflows/pgfplots-gallery-pairs.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-pairs:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific reference renderer and TeX
        run: |
          python -m pip install 'altair>=5.5,<6' 'vl-convert-python>=1.6,<2' 'pandas>=2,<3' 'numpy>=1.26,<3' 'PyMuPDF>=1.24,<2' 'pillow>=10,<13'
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-pictures
      - name: Render exact source specifications with Altair and PGFPlots
        run: |
          python vl-convert-rs/tests/native-pgfplots/gallery_pairs.py "$RUNNER_TEMP/gallery-pairs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: altair-pgfplots-side-by-side
          path: ${{ runner.temp }}/gallery-pairs
          if-no-files-found: error
