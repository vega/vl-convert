name: Verify PGFPlots final regressions once
on:
  push:
    branches: [feature/experimental-pgfplots-export]
    paths: ['.github/workflows/pgfplots-final-regressions-once.yml']
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'marcusinthesky/vl-convert'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply source-checked fixes without changing access policy
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('vl-convert-rs/src/js/native_pgfplots_normalize.js');s=p.read_text()
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='650427662de4a44c271796d49aa1e8b40b72987d6324deffa88b307104146d60'
          anchor='      // Resolve visual channels using the evaluated official marks, never pixel'
          assert s.count(anchor)==1
          insert='''      // Preserve resolved categorical label orientation; horizontal TeX defaults
                // can make an otherwise correct dense categorical plot unreadable.
                for(const c of ['x','y'])if(enc[c] && enc[c].axis!==null && enc[c].axis?.labelAngle===undefined) {
                  const orientations=c==='x'?['bottom','top']:['left','right'];
                  const guide=(result.compiled.axes || []).find(a=>a.labels!==false && orientations.includes(a.orient));
                  if(typeof guide?.labelAngle==='number')enc[c].axis={...enc[c].axis,labelAngle:guide.labelAngle};
                }
          '''
          p.write_text(s.replace(anchor,insert+anchor))
          p=Path('vl-convert-rs/tests/native-pgfplots/normalize.test.mjs')
          p.write_text(p.read_text()+r'''
          test('categorical default label orientation is retained without overriding explicit choices',async()=>{
           const s={data:{values:[{category:'One',v:2},{category:'Two',v:4}]},mark:'bar',encoding:{x:n('category'),y:q('v')}};
           const defaultOut=await run(s);assert.equal(defaultOut.ir.panels[0].axes.x.axis.labelAngle,270);
           assert.match(defaultOut.tex,/xticklabel style=\{rotate=-270,anchor=east\}/);
           s.encoding.x.axis={labelAngle:0};const flat=await run(s);assert.equal(flat.ir.panels[0].axes.x.axis.labelAngle,0);
           assert.doesNotMatch(flat.tex,/rotate=-270/);
           s.encoding.x.axis=null;assert.equal((await run(s)).ir.panels[0].axes.x.axis,null);
          });
          ''')
          p=Path('vl-convert-python/tests/test_pgfplots.py');s=p.read_text()
          old='        {"mark": "line", "data": {"url": "file:///etc/passwd"}},\n'
          assert s.count(old)==1
          s=s.replace(old,'')
          s+=r'''

          @pytest.mark.parametrize("asynchronous", [False, True])
          def test_denied_data_access_raises_permission_error(tmp_path, spec, asynchronous):
              import vl_convert.asyncio as avlc

              source = tmp_path / "data.json"
              source.write_text(json.dumps(spec["data"]["values"]), encoding="utf-8")
              external = dict(spec, data={"url": source.resolve().as_uri()})
              # Test access denial against an existing file on every platform, not
              # the existence of /etc/passwd. Keep worker recovery covered too.
              vlc.configure(allowed_base_urls=[])
              try:
                  if asynchronous:
                      async def run():
                          with pytest.raises(PermissionError, match="VLC_ACCESS_DENIED"):
                              await avlc.vegalite_to_pgfplots(external)
                          assert r"\addplot" in await avlc.vegalite_to_pgfplots(spec)

                      asyncio.run(run())
                  else:
                      with pytest.raises(PermissionError, match="VLC_ACCESS_DENIED"):
                          vlc.vegalite_to_pgfplots(external)
                      assert r"\addplot" in vlc.vegalite_to_pgfplots(spec)
              finally:
                  vlc.configure(allowed_base_urls=None)
          '''
          p.write_text(s)
          PY
          python -m pip install ruff==0.14.10
          ruff format vl-convert-python/tests/test_pgfplots.py
          ruff format --check vl-convert-python
          node --test vl-convert-rs/tests/native-pgfplots/native.test.cjs
          node --no-warnings --loader ./vl-convert-rs/tests/native-pgfplots/vendor-loader.mjs --test vl-convert-rs/tests/native-pgfplots/normalize.test.mjs
          python vl-convert-rs/tests/native-pgfplots/test_gallery_contracts.py
          git diff --check
      - name: Commit verified source and regression tests
        run: |
          git add vl-convert-rs/src/js/native_pgfplots_normalize.js vl-convert-rs/tests/native-pgfplots/normalize.test.mjs vl-convert-python/tests/test_pgfplots.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(pgfplots): retain categorical labels and test denied resource access portably'
          git push origin HEAD:feature/experimental-pgfplots-export
