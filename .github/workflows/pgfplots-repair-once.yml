name: Repair PGFPlots CI regressions once
on:
  push:
    branches: [feature/experimental-pgfplots-export]
    paths: ['.github/workflows/pgfplots-repair-once.yml']
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'marcusinthesky/vl-convert'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUST_MIN_STACK: 8388608
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Apply scoped fixes and preserve security assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('vl-convert-rs/src/js/native_pgfplots_normalize.js');s=p.read_text()
          old="const compiled = vl.compile({...spec, name:'__pgf_probe'}, {logger:log}).spec;"
          assert s.count(old)==1
          s=s.replace(old,"""// ARIA descriptions are browser-only. Vega-Lite builds them as expression
                // strings from labels; literal U+2028/U+2029 can break Vega's parser.
                // Disable only those probe descriptions, not the caller's labels/data.
                const compiled = vl.compile({...spec, name:'__pgf_probe',
                  config:{...spec.config, aria:false}}, {logger:log}).spec;""")
          old='const configs=defs.map(d=>d.axis).filter(a=>a!=null);'
          assert s.count(old)==1
          s=s.replace(old,'// Undefined means default axes, not hidden axes. Only explicit null hides.\n          const configs=defs.map(d=>d.axis).filter(a=>a!==null);')
          p.write_text(s)
          p=Path('vl-convert-rs/src/js/native_pgfplots.js');s=p.read_text()
          old=r'replace(/[\r\n\t]/g, " ")'
          assert s.count(old)==1
          p.write_text(s.replace(old,r'replace(/[\r\n\t\u2028\u2029]/g, " ")'))
          p=Path('vl-convert-python/src/pgfplots.rs');s=p.read_text()
          assert s.count('.transpose()?')==2
          p.write_text(s.replace('.transpose()?', '.transpose()\n        .map_err(|err| pyo3::exceptions::PyValueError::new_err(err.to_string()))?'))
          p=Path('vl-convert-rs/tests/native-pgfplots/normalize.test.mjs')
          p.write_text(p.read_text()+r'''
          test('quoted labels and Unicode separators stay data, not generated expressions',async()=>{
           const title="');globalThis.compromised=1;//\n\u2028\u2029\\input{secret}";
           const input=structuredClone(base);input.encoding.x.title=title;
           const before=JSON.stringify(input);
           const out=await run(input);
           assert.equal(JSON.stringify(input),before);
           assert.equal(globalThis.compromised,undefined);
           assert.ok(out.tex.includes('textbackslash{}input'));
           assert.ok(!out.tex.includes('\\input{secret}'));
           assert.ok(!/[\u2028\u2029]/.test(out.tex));
           assert.match((await run(base)).tex,/\\addplot/);
          });
          test('shared layered axes remain visible unless all layers explicitly hide them',async()=>{
           const spec={data:base.data,layer:[{mark:'bar',encoding:base.encoding},{mark:'line',encoding:base.encoding}]};
           let out=await run(spec);
           for(const c of ['x','y'])assert.notEqual(out.ir.panels[0].axes[c].axis,null);
           assert.doesNotMatch(out.tex,/axis [xy] line=none/);
           for(const layer of spec.layer)layer.encoding=structuredClone(base.encoding);
           spec.layer[0].encoding.x.axis=null;
           out=await run(spec);assert.notEqual(out.ir.panels[0].axes.x.axis,null);
           spec.layer[1].encoding.x.axis=null;
           out=await run(spec);assert.equal(out.ir.panels[0].axes.x.axis,null);
          });
          ''')
          p=Path('vl-convert-python/tests/test_pgfplots.py');s=p.read_text()
          s=s.replace('with pytest.raises(ValueError):\n        vlc.vegalite_to_pgfplots(spec, vl_version="not-a-version")','with pytest.raises(ValueError, match="Unsupported Vega-Lite version"):\n        vlc.vegalite_to_pgfplots(spec, vl_version="not-a-version")')
          s+=r'''

          def test_async_invalid_version_is_value_error(spec):
              import vl_convert.asyncio as avlc

              async def run():
                  with pytest.raises(ValueError, match="Unsupported Vega-Lite version"):
                      await avlc.vegalite_to_pgfplots(spec, vl_version="not-a-version")
                  assert r"\addplot" in await avlc.vegalite_to_pgfplots(spec)

              asyncio.run(run())


          def test_quoted_unicode_title_remains_data(spec):
              spec["encoding"]["x"]["title"] = "');globalThis.compromised=1;//\n\u2028\u2029\\input{secret}"
              tex = vlc.vegalite_to_pgfplots(spec)
              assert "textbackslash{}input" in tex
              assert r"\input{secret}" not in tex
              assert "\u2028" not in tex and "\u2029" not in tex
          '''
          p.write_text(s)
          PY
          python -m pip install ruff==0.14.10
          ruff format vl-convert-python vl-convert-python/tests/test_pgfplots.py
          cargo fmt --all
          node --test vl-convert-rs/tests/native-pgfplots/native.test.cjs
          node --no-warnings --loader ./vl-convert-rs/tests/native-pgfplots/vendor-loader.mjs --test vl-convert-rs/tests/native-pgfplots/normalize.test.mjs
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          prefix-key: v2-rust
          shared-key: native-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: true
      - name: Verify actual Rust and CLI interfaces with regenerated V8 archives
        run: |
          cargo clean -p v8
          cargo test -p vl-convert-rs --test test_pgfplots -- --test-threads=1
          cargo test -p vl-convert --test test_pgfplots_cli -- --test-threads=1
      - name: Commit verified fixes and remove temporary maintenance workflows
        run: |
          git rm .github/workflows/pgfplots-apply-once.yml .github/workflows/pgfplots-diagnostic-snapshot.yml .github/workflows/pgfplots-repair-once.yml
          git add vl-convert-python/src/pgfplots.rs vl-convert-python/tests/test_pgfplots.py vl-convert-python/vl_convert.pyi vl-convert-rs/src/js/native_pgfplots.js vl-convert-rs/src/js/native_pgfplots_normalize.js vl-convert-rs/tests/native-pgfplots/normalize.test.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(pgfplots): preserve default axes and handle Unicode/version inputs'
          git push origin HEAD:feature/experimental-pgfplots-export
