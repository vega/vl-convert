name: Apply tested PGFPlots phase 0-2 changes
on:
  push:
    branches: [feature/experimental-pgfplots-export]
    paths: ['.github/workflows/pgfplots-apply-once.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'marcusinthesky/vl-convert'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUST_MIN_STACK: 8388608
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Apply the hash-checked, locally tested patch
        run: |
          python - <<'PY'
          import base64,gzip,hashlib,subprocess
          from pathlib import Path
          encoded=''.join(Path(f'tools/.pgfplots-stage012-{i}.b64').read_text().strip() for i in range(6))
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest() == '5dbc96f8c59487ccefc1d73926c7f20ab793c2d5f9a6c9ae53fd5cb8bb531939'
          assert b'diff --git a/.github/' not in patch
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          PY
          cargo fmt --all
          node --test vl-convert-rs/tests/native-pgfplots/native.test.cjs
          node --no-warnings --loader ./vl-convert-rs/tests/native-pgfplots/vendor-loader.mjs --test vl-convert-rs/tests/native-pgfplots/normalize.test.mjs
      - name: Commit production source, tests, and documentation
        run: |
          git rm tools/.pgfplots-stage012-*.b64
          git add vl-convert-rs vl-convert-python vl-convert docs/source/_topics/pgfplots.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(pgfplots): normalize official dataflows and complete core Cartesian primitives'
          git push origin HEAD:feature/experimental-pgfplots-export
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          prefix-key: v2-rust
          shared-key: native-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: true
      - name: Test actual native Rust and CLI interfaces
        run: |
          cargo test -p vl-convert-rs --test test_pgfplots -- --test-threads=1
          cargo test -p vl-convert --test test_pgfplots_cli -- --test-threads=1
