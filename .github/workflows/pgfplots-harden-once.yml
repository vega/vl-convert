name: Harden native PGFPlots once
on:
  push:
    branches: [feature/experimental-pgfplots-export]
    paths: [.github/workflows/pgfplots-harden-once.yml]
permissions:
  contents: write
jobs:
  harden:
    if: github.repository == 'marcusinthesky/vl-convert'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce boundary errors and fix the exact tested source
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, re, subprocess
          source = Path('vl-convert-rs/src/js/native_pgfplots.js')
          text = source.read_text()
          assert hashlib.sha256(text.encode()).hexdigest() == 'fe76a3733733a11a97c242a5be46098ef18064c5e205be6578486083019e0fc1', 'Source changed; inspect before applying fixes'
          tests = Path('vl-convert-rs/tests/native-pgfplots/native.test.cjs')
          tests.write_text(tests.read_text() + '''
          test('decimal histogram boundaries are stable against division roundoff',()=>{
            const s={data:{values:[.3,.3-1e-8,.6,.9].map(v=>({v}))},mark:'bar',encoding:{x:{...q('v'),bin:{step:.1,extent:[0,1]}},y:{aggregate:'count',type:'quantitative'}}};
            const bars=lower(s).panels[0].plots[0].bars;
            assert.deepEqual(bars.map(b=>Math.round(b.c*10)),[2,3,6,9]);
            assert.deepEqual(bars.map(b=>b.high),[1,1,1,1]);
          });
          test('explicit normalization also applies with one series',()=>{
            const s={data:{values:[{g:'A',v:2},{g:'B',v:4}]},mark:'bar',encoding:{x:n('g'),y:{...q('v'),stack:'normalize'}}};
            assert.deepEqual(lower(s).panels[0].plots[0].upper,[[0,1],[1,1]]);
          });
          test('explicit stacking is not silently ignored on points or log axes',()=>{
            const s=clone(basic);s.mark='point';s.encoding.y.stack='zero';
            assert.throws(()=>compile(s),/bar or area/);
            s.mark='bar';s.encoding.y.scale={type:'log'};
            assert.throws(()=>compile(s),/linear measure/);
          });
          test('generated aggregate fields cannot overwrite a grouping field',()=>{
            const s={data:{values:[{v:2,__vlc_aggregate_x:'A'}]},mark:'point',encoding:{x:{...q('v'),aggregate:'mean'},y:{datum:1},color:n('__vlc_aggregate_x')}};
            assert.throws(()=>compile(s),/aggregate field collision/);
          });
          test('shared scale semantics do not depend on JSON property order',()=>{
            const a=clone(basic),b=clone(basic);delete a.width;delete a.height;delete b.width;delete b.height;
            a.encoding.x.scale={domain:[0,5],reverse:true};
            b.encoding.x.scale={reverse:true,domain:[0,5]};
            assert.doesNotThrow(()=>compile({layer:[a,b]}));
          });
          ''')
          before = subprocess.run(['node','--test',str(tests)], capture_output=True, text=True)
          assert before.returncode != 0, 'Regressions unexpectedly passed before fixes'
          Path('/tmp/pgfplots-before.log').write_text(before.stdout + before.stderr)
          def replace(old, new):
              global text
              assert text.count(old) == 1, f'Non-unique patch anchor: {old[:80]}'
              text = text.replace(old, new)
          replace('const id = v => JSON.stringify(v);', 'const id = v => JSON.stringify(v, (_, x) => x && typeof x === "object" && !Array.isArray(x) ? Object.fromEntries(Object.keys(x).sort().map(k => [k, x[k]])) : x);')
          replace('const i = Math.min(Math.round(count) - 1, Math.floor((v - lo) / step));', '''const quotient = (v - lo) / step, nearest = Math.round(quotient);
                  // Snap only division roundoff at an exact bin boundary.
                  const stable = Math.abs(quotient - nearest) <= 8 * Number.EPSILON * Math.max(1, Math.abs(quotient)) ? nearest : quotient;
                  const i = Math.min(Math.round(count) - 1, Math.floor(stable));''')
          replace('''if (terms.length) {
                const by''', '''if (terms.length) {
                for (const [c] of terms) if (rows.some(r => own(r, `__vlc_aggregate_${c}`))) fail(p, "reserved aggregate field collision");
                const by''')
          replace('const stack = !offset && axes[measure].kind === "linear" && ["bar", "area"].includes(m.type) && allSeries.length > 1 && e.color?.field ? (e[measure]?.stack === undefined ? "zero" : e[measure].stack) : null;', '''const requestedStack = e[measure]?.stack;
                if (requestedStack != null && !["bar", "area"].includes(m.type)) fail(at, "stacking requires a bar or area mark");
                if (requestedStack != null && axes[measure].kind !== "linear") fail(at, "stacking requires a linear measure axis");
                const stack = !offset && axes[measure].kind === "linear" && ["bar", "area"].includes(m.type)
                  ? (requestedStack === undefined ? (allSeries.length > 1 && e.color?.field ? "zero" : null) : requestedStack) : null;''')
          source.write_text(text)
          fixtures = Path('vl-convert-rs/tests/native-pgfplots/fixtures.cjs')
          fixture_text = fixtures.read_text()
          assert fixture_text.count(' return out;') == 1
          fixtures.write_text(fixture_text.replace(' return out;', ''' out.decimal_histogram={data:{values:[.3,.3-1e-8,.6,.9].map(v=>({v}))},mark:'bar',encoding:{x:{...q('v'),bin:{step:.1,extent:[0,1]}},y:{aggregate:'count',type:'quantitative'}}};
           out.single_normalized={data:{values:[{g:'A',v:2},{g:'B',v:4}]},mark:'bar',encoding:{x:n('g'),y:{...q('v'),stack:'normalize'}}};
           return out;'''))
          result = subprocess.run(['node','--test','--experimental-test-coverage',str(tests)], capture_output=True, text=True)
          Path('/tmp/pgfplots-after.log').write_text(result.stdout + result.stderr)
          print(result.stdout)
          assert result.returncode == 0, result.stderr
          count = re.search(r'^# tests (\d+)', result.stdout, re.M).group(1)
          record = Path('vl-convert-rs/tests/native-pgfplots/VALIDATION.md')
          record.write_text(record.read_text() + '\n## Follow-up numerical regression run\n\n'
              + 'The original evidence above remains a historical record for its pinned source.\n'
              + 'New regressions were first observed failing, then passed after fixes for decimal\n'
              + 'histogram roundoff, single-series normalization, invalid explicit stacks,\n'
              + 'aggregate field collisions, and object-property-order-independent scale comparison.\n'
              + f'Current compiler SHA-256: `{hashlib.sha256(source.read_bytes()).hexdigest()}`.\n'
              + f'The exact updated source passed **{count} Node tests** in GitHub Actions.\n'
              + 'Two additional TeX fixtures cover decimal bins and single-series normalization;\n'
              + 'their rendering results must be checked in the Native PGFPlots workflow.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-pgfplots-boundary-regressions
          path: /tmp/pgfplots-*.log
          if-no-files-found: warn
      - name: Commit verified source changes
        run: |
          git add vl-convert-rs/src/js/native_pgfplots.js vl-convert-rs/tests/native-pgfplots/native.test.cjs vl-convert-rs/tests/native-pgfplots/fixtures.cjs vl-convert-rs/tests/native-pgfplots/VALIDATION.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(pgfplots): preserve boundary and normalization semantics'
          git push origin HEAD:feature/experimental-pgfplots-export
